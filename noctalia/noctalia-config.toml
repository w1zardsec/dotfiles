[accessibility]
ui_scale = 1.1000000089406967

[bar.default]
background_opacity = 0.79999998211860657
capsule_radius = 0
center = [ "media", "spacer_1", "clock" ]
concave_edge_corners = false
end = [ "date", "spacer_2", "battery", "privacy", "tray" ]
font_family = "DepartureMono Nerd Font"
margin_ends = 150
radius = 0
scale = 1.300000011920929
start = [ "workspaces" ]
thickness = 35

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[lockscreen]
fingerprint = false

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000001", "lockscreen-widget-0000000000000002" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 906.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 0.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 0.0
        layout = "compact"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = false
        show_unlock_hint = false
        show_weather = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 960.0
    cy = 540.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background_opacity = 0.48999999999999999
        background_padding = 4
        background_radius = 0
        format = "{:%H:%M:%S}"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 0.0
    box_width = 0.0
    cx = 960.0
    cy = 716.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "media_player"

[shell]
avatar_path = ""
button_borders = false
card_borders = false
clipboard_history_max_entries = 200
corner_radius_scale = 0.0
font_family = "DepartureMono Nerd Font"
input_borders = false
password_style = "random"
polkit_agent = true
popup_borders = false

    [shell.launcher]
    categories = false
    compact = true
    show_app_origin_indicator = false

    [shell.panel]
    clipboard_placement = "attached"
    control_center_position = "top_left"
    session_position = "center"

    [shell.screen_corners]
    size = 1

    [shell.screenshot]
    directory = "/home/jack/Pictures/Screenshots"

    [shell.session]
    grid_columns = 4

[theme]
builtin = "Nord"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-rainbow"

    [theme.templates]
    builtin_ids = [ "foot", "gtk3", "gtk4", "mango", "qt" ]
    community_ids = [ "discord", "fuzzel", "fastfetch" ]

[wallpaper]
directory = "/home/jack/Pictures/Wallpapers"

    [wallpaper.default]
    path = ""

    [wallpaper.last]
    path = ""

    [wallpaper.monitors.eDP-1]
    path = ""

[widget.battery]
display_mode = "graphic"

[widget.clock]
format = "{:%H:%M:%S}"
timezone = ""

[widget.date]
timezone = ""

[widget.media]
title_scroll = "always"

[widget.spacer_1]
type = "spacer"

[widget.spacer_2]
length = 10
type = "spacer"

[widget.workspaces]
label_source = "name"
max_label_chars = 12
style = "minimal"
