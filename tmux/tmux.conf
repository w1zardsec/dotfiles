# ══════════════════════════════════════════════════════════════
#  tmux.conf  —  chjwoo & dante
#  Prefix = Ctrl-A.  Cheatsheet at the bottom of this file.
#  Reload after editing:  prefix + r
# ══════════════════════════════════════════════════════════════

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# Plugin pemulih session
#set -g @plugin 'tmux-plugins/tmux-resurrect'
#set -g @plugin 'tmux-plugins/tmux-continuum'

# Otomatis restore session saat Tmux dijalankan
#set -g @continuum-restore 'on'

# (Opsional) Simpan juga isi/program yang sedang berjalan di dalam pane (seperti Vim/Neovim)
#set -g @resurrect-strategy-nvim 'session'
#set -g @resurrect-capture-pane-contents 'on'

# ── Prefix ────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix          # C-a C-a sends a literal Ctrl-A to the shell

# Reload this file without restarting the server
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# ── Terminal & colors ─────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-features ",foot:RGB"
set -as terminal-features ",xterm-256color:RGB"
set -g allow-passthrough on    # kitty graphics protocol / image previews
set -g focus-events on         # editors notice focus changes (vim autoread)
set -g set-clipboard on        # OSC52: copy reaches the host clipboard
set -g default-shell /usr/bin/bash

# ── Core behaviour ────────────────────────────────────────────
set -s escape-time 0           # no lag on Esc (matters in vim)

# Clear the active shell command line with Meta/Alt shortcuts
bind -n M-d      send-keys C-a C-k
bind -n M-D      send-keys C-a C-k
bind -n M-Delete send-keys C-a C-k
set -g history-limit 50000     # default 2000 is uselessly small
set -g display-time 2000       # messages stay readable
set -g status-interval 5       # refresh the tun0 status every 5s
set -g mouse on
set -g base-index 1            # windows start at 1, not 0
setw -g pane-base-index 1
set -g renumber-windows on     # no gaps after closing a window
setw -g automatic-rename on
set -g set-titles on
set -g detach-on-destroy off   # killing a session drops you in another, not out

# ── Detach ────────────────────────────────────────────────────
bind d   detach-client
bind C-d detach-client         # for when Ctrl is still held from the prefix

# ── Splits & windows ──────────────────────────────────────────
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window     -c "#{pane_current_path}"

# ── Pane navigation ───────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Pane resize (repeatable: hold prefix once, then tap) ──────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Window navigation ─────────────────────────────────────────
bind -r n next-window
bind -r p previous-window
bind Tab last-window
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# ── Sessions ──────────────────────────────────────────────────
bind s choose-tree -Zs         # fullscreen session picker
bind w choose-tree -Zw         # fullscreen window picker
bind N new-session

# ── Mouse toggle (turn off to use native terminal selection) ──
bind m if -F '#{mouse}' \
  'set -g mouse off; display-message "Mouse: off"' \
  'set -g mouse on;  display-message "Mouse: on"'

# ── Copy mode (vi keys, Wayland clipboard) ────────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind P paste-buffer
bind -T copy-mode-vi v     send-keys -X begin-selection
bind -T copy-mode-vi C-v   send-keys -X rectangle-toggle
bind -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi H     send-keys -X start-of-line
bind -T copy-mode-vi L     send-keys -X end-of-line
# Drag-select with the mouse copies but keeps the selection visible
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "wl-copy"

# ── Monochrome theme ──────────────────────────────────────────
set -g status-position top
set -g status-style bg=#1a1a1a,fg=#ffffff
set -g status-left-length 40
set -g status-right-length 60
# The dot lights up while the prefix is armed — useful while learning
set -g status-left '#[fg=#ffffff,bold] 󰖔 #S #[fg=#ff5f5f]#{?client_prefix,● ,}#[default]'
set -g status-right '#[fg=#cccccc]#(ip -4 -o addr show dev tun0 2>/dev/null | awk '\''NR==1 {split($4,a,"/"); print "tun0 " a[1]; found=1} END {if (!found) print "tun0 down"}'\'') '
set -g window-status-format         ' [#I]:#W#{?window_zoomed_flag, +,} '
set -g window-status-current-format ' [#I]:#W#{?window_zoomed_flag, +,} '
set -g window-status-current-style bg=#555555,fg=#ffffff,bold
set -g window-status-style         bg=#1a1a1a,fg=#999999
set -g pane-border-style        fg=#333333
set -g pane-active-border-style fg=#888888
set -g message-style bg=#555555,fg=#ffffff
set -g mode-style    bg=#555555,fg=#ffffff

run '~/.tmux/plugins/tpm/tpm'

# ══════════════════════════════════════════════════════════════
#  CHEATSHEET  (prefix = Ctrl-A)
#
#  SESSION   d detach      s session picker   N new session
#  WINDOW    c new         n/p next/prev      Tab last
#            w picker      , rename           & kill    </> move
#  PANE      | vsplit      - hsplit           hjkl move
#            HJKL resize   z zoom             x kill    Space layout
#  COPY      Enter or scroll to enter    v select   y copy   Esc quit
#            / search up   ? search down      P paste
#  MISC      r reload      m mouse on/off     ? list every binding
#            t clock       : command prompt
# ══════════════════════════════════════════════════════════════
