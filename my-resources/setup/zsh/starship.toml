"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
scan_timeout = 30
command_timeout = 500

# Compact two-line prompt: context above, command marker below.
format = '''
[╭─](bold blue) $directory$git_branch$git_status$cmd_duration
[╰─](bold blue)$character'''

[directory]
format = '[$path]($style) '
style = 'bold cyan'
truncation_length = 3
truncation_symbol = '…/'
read_only = ' (ro)'
read_only_style = 'yellow'

[git_branch]
format = '[ $branch]($style) '
style = 'bold purple'
truncation_symbol = '…'

[git_status]
format = '[$all_status$ahead_behind]($style) '
style = 'bold yellow'
conflicted = '!'
ahead = '⇡'
behind = '⇣'
diverged = '⇕'
untracked = '?'
modified = '~'
staged = '+'
renamed = '»'
deleted = '×'

[cmd_duration]
min_time = 2000
format = '[took $duration]($style) '
style = 'dimmed white'

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold yellow)'
